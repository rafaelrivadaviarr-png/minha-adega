<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Adega</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<meta name="theme-color" content="#5a1428">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍷</text></svg>">
<style>
:root{
  --bg:#f6efe4;--paper:#fffaf2;--card:#fffaf2;--txt:#2b1a1f;--muted:#7d6a62;--line:#e6d9c6;
  --acc:#6e1a32;--acc2:#8c2441;--deep:#3d0d1c;--gold:#a8834a;--gold2:#c9a96e;
  --ok:#4d6b35;--warn:#b07a1f;--bad:#9e2a2b;
  --tinto:#6e1a32;--branco:#d8bb5c;--rose:#e0899f;--espumante:#cbb98a;--sobremesa:#c27c2c;--fortificado:#5c2a1a;
  --serif:'Cormorant Garamond','Playfair Display',Georgia,serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --sombra:0 1px 2px rgba(61,13,28,.06),0 6px 18px -8px rgba(61,13,28,.18);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#140b0e;--paper:#1f1216;--card:#1f1216;--txt:#f1e6da;--muted:#b09c90;--line:#3a262b;
  --acc:#c4546f;--acc2:#d9718a;--deep:#0b0507;--gold:#c9a96e;--gold2:#e0c58f;
  --ok:#8fb36a;--warn:#e0b05a;--bad:#e06a62;--sombra:0 1px 2px rgba(0,0,0,.4),0 8px 24px -10px rgba(0,0,0,.7);
}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px;line-height:1.5;
  background-image:radial-gradient(rgba(110,26,50,.035) 1px,transparent 1px);background-size:14px 14px}

/* Cabeçalho estilo rótulo de vinícola */
header{position:relative;overflow:hidden;color:#f6ead8;padding:28px 16px 30px;text-align:center;
  background:radial-gradient(120% 140% at 50% 0%,#8c2441 0%,#5a1428 45%,#2a0812 100%)}
header::after{content:'';position:absolute;inset:10px;border:1px solid rgba(201,169,110,.45);border-radius:4px;pointer-events:none}
header .selo{width:46px;height:46px;margin:0 auto 6px;color:var(--gold2)}
header h1{font-family:var(--serif);font-weight:600;font-size:38px;letter-spacing:.04em;line-height:1}
header .orn{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px auto 8px;color:var(--gold2);font-size:11px;letter-spacing:.35em;text-transform:uppercase}
header .orn::before,header .orn::after{content:'';height:1px;width:46px;background:linear-gradient(90deg,transparent,var(--gold2),transparent)}
header p{font-family:var(--serif);font-style:italic;font-size:17px;opacity:.9;max-width:520px;margin:0 auto}
header .uvas{position:absolute;opacity:.12;color:#f6ead8;width:150px;top:-10px}
header .uvas.e{left:-30px;transform:rotate(-18deg)}header .uvas.d{right:-30px;transform:scaleX(-1) rotate(-18deg)}

nav{display:flex;gap:4px;overflow-x:auto;background:var(--paper);border-bottom:1px solid var(--line);padding:0 12px;position:sticky;top:0;z-index:5;justify-content:center;box-shadow:0 4px 12px -10px rgba(61,13,28,.4)}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:14px 12px;font-family:var(--serif);font-size:17px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;letter-spacing:.02em}
nav button.on{color:var(--acc);border-color:var(--gold)}
main{max-width:980px;margin:0 auto;padding:20px 16px 40px}
section{display:none}section.on{display:block;animation:surge .35s ease}
@keyframes surge{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}

.btn{background:linear-gradient(180deg,var(--acc2),var(--acc));color:#fff8ee;border:0;border-radius:999px;padding:10px 18px;font:inherit;font-weight:600;letter-spacing:.02em;cursor:pointer;box-shadow:0 2px 6px -2px rgba(110,26,50,.5);transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(1px)}
.btn.sec{background:transparent;color:var(--acc);border:1px solid var(--gold);box-shadow:none}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--txt);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px rgba(168,131,74,.18)}
label{font-size:11px;font-weight:600;color:var(--muted);display:block;margin-bottom:5px;letter-spacing:.12em;text-transform:uppercase}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
/* Cartão = rótulo: papel creme com filete dourado interno */
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px;box-shadow:var(--sombra)}
.card::before{content:'';position:absolute;inset:5px;border:1px solid rgba(168,131,74,.28);border-radius:3px;pointer-events:none}
.grid>.card{border-top:4px solid var(--acc)}
.card h3{font-family:var(--serif);font-size:23px;font-weight:600;line-height:1.15;margin-bottom:4px}
.muted{color:var(--muted);font-size:13px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:middle;box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--gold)}
.tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;background:transparent;border:1px solid var(--line);margin:2px 4px 2px 0;letter-spacing:.04em}
.tag.ponto{color:var(--ok);border-color:var(--ok)}.tag.jovem{color:var(--warn);border-color:var(--warn)}.tag.passando{color:var(--bad);border-color:var(--bad)}
.stars{color:var(--gold);letter-spacing:2px}

h2{font-family:var(--serif);font-size:25px;font-weight:600;margin:26px 0 10px;display:flex;align-items:center;gap:12px}
h2::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
.res{display:flex;gap:16px;align-items:flex-start;padding:14px 4px;border-bottom:1px dashed var(--line)}
.res:last-child{border-bottom:0}
.res strong{font-family:var(--serif);font-size:19px;font-weight:600}
/* Nota = selo de lacre */
.score{min-width:60px;height:60px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:23px;line-height:1;color:#fff8ee;
  box-shadow:inset 0 0 0 3px rgba(255,248,238,.25),inset 0 -6px 10px rgba(0,0,0,.18),0 2px 6px -2px rgba(0,0,0,.35)}
.score small{font-family:var(--sans);font-size:7.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.why{font-size:13px;margin-top:4px}.why li{list-style:none;padding:1px 0}.why .p::before{content:'❦ ';color:var(--ok)}.why .c::before{content:'✕ ';color:var(--bad)}

.chips{display:flex;flex-wrap:wrap;gap:6px;max-height:220px;overflow:auto;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;user-select:none;background:var(--bg);transition:all .12s}
.chip.on{background:var(--acc);color:#fff8ee;border-color:var(--acc)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.form .full{grid-column:1/-1}

dialog{border:0;border-radius:10px;padding:0;width:min(640px,calc(100% - 32px));background:var(--paper);color:var(--txt);box-shadow:0 20px 60px -20px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(30,6,14,.6);backdrop-filter:blur(2px)}
dialog .hd{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(168,131,74,.08),transparent)}
dialog .hd strong{font-family:var(--serif);font-size:23px;font-weight:600}
dialog .bd{padding:18px;max-height:70vh;overflow:auto}
dialog .ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}

.empty{text-align:center;padding:44px 16px;color:var(--muted);font-family:var(--serif);font-size:19px}
.empty::before{content:'🍷';display:block;font-size:40px;margin-bottom:10px;filter:grayscale(.2)}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--acc))}
.prof{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:11px;align-items:center;margin-top:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ia-box{background:linear-gradient(135deg,rgba(110,26,50,.06),rgba(168,131,74,.08));border:1px dashed var(--gold);border-radius:10px;padding:12px}
.ia-box img{max-height:120px;border-radius:6px;margin-top:8px;display:block;box-shadow:var(--sombra)}
.discordo{background:none;border:0;color:var(--gold);font:inherit;font-size:12px;font-style:italic;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0;margin-top:6px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--deep);color:#f6ead8;border:1px solid var(--gold);padding:10px 18px;border-radius:999px;font-size:14px;z-index:50;max-width:calc(100% - 32px);box-shadow:var(--sombra)}
footer{text-align:center;padding:10px 16px 30px;color:var(--muted);font-family:var(--serif);font-style:italic;font-size:15px}
@media (max-width:520px){header h1{font-size:32px}nav{justify-content:flex-start}.card h3{font-size:21px}}
</style>
</head>
<body>
<header><svg class="uvas e" viewBox="0 0 100 120" fill="currentColor" aria-hidden="true"><path d="M50 4c2 6 8 10 16 10" stroke="currentColor" stroke-width="3" fill="none"/><circle cx="34" cy="30" r="10"/><circle cx="56" cy="30" r="10"/><circle cx="78" cy="30" r="10"/><circle cx="45" cy="48" r="10"/><circle cx="67" cy="48" r="10"/><circle cx="23" cy="48" r="10"/><circle cx="34" cy="66" r="10"/><circle cx="56" cy="66" r="10"/><circle cx="45" cy="84" r="10"/></svg><svg class="uvas d" viewBox="0 0 100 120" fill="currentColor" aria-hidden="true"><path d="M50 4c2 6 8 10 16 10" stroke="currentColor" stroke-width="3" fill="none"/><circle cx="34" cy="30" r="10"/><circle cx="56" cy="30" r="10"/><circle cx="78" cy="30" r="10"/><circle cx="45" cy="48" r="10"/><circle cx="67" cy="48" r="10"/><circle cx="23" cy="48" r="10"/><circle cx="34" cy="66" r="10"/><circle cx="56" cy="66" r="10"/><circle cx="45" cy="84" r="10"/></svg><svg class="selo" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 6h24l-2 18a10 10 0 0 1-20 0z"/><path d="M22 18h20" stroke-width="1.5"/><path d="M32 34v18M22 58h20"/></svg><h1>Minha Adega</h1><div class="orn">Vinhos · Harmonização</div><p>Seus vinhos, o prato certo e a garrafa ideal para cada ocasião.</p></header>
<nav>
  <button data-tab="adega" class="on">Adega</button>
  <button data-tab="vinho">Vinho → Comida</button>
  <button data-tab="comida">Comida → Vinho</button>
  <button data-tab="uvas">Guia de uvas</button>
</nav>
<main>
  <section id="adega" class="on">
    <div class="row">
      <button class="btn" id="btnNovo">+ Adicionar vinho</button>
      <input id="busca" placeholder="Buscar por nome, marca, uva..." style="flex:1;min-width:180px">
      <select id="filtroTipo" style="width:auto"><option value="">Todos os tipos</option></select>
    </div>
    <div class="row muted" id="resumo"></div>
    <div class="grid" id="listaAdega"></div>
    <div class="row" style="margin-top:20px">
      <button class="btn sec sm" id="btnExportar">Exportar backup</button>
      <label class="btn sec sm" style="margin:0;color:var(--acc)">Importar backup<input type="file" id="arqImportar" accept=".json" hidden></label>
      <button class="btn sec sm" id="btnExemplos">Carregar exemplos</button>
    </div>
  </section>

  <section id="vinho">
    <div class="form" style="margin-bottom:12px">
      <div><label>Vinho da adega</label><select id="selVinho"></select></div>
      <div><label>…ou uma uva qualquer</label><select id="selUva"></select></div>
    </div>
    <div id="resVinho"></div>
  </section>

  <section id="comida">
    <div class="form" style="margin-bottom:12px">
      <div class="full"><label>Qual é o prato?</label><select id="selPrato"></select></div>
    </div>
    <div id="resComida"></div>
  </section>

  <section id="uvas"><div class="grid" id="listaUvas"></div></section>
</main>
<footer>Beba com moderação · Feito para quem gosta de vinho</footer>

<dialog id="dlg">
  <form method="dialog" id="frm">
    <div class="hd"><strong id="dlgTitulo">Novo vinho</strong><button class="btn sec sm" value="cancel" formnovalidate>✕</button></div>
    <div class="bd form">
      <div class="full ia-box">
        <label class="btn" style="margin:0;color:#fff;text-align:center;display:block">📷 Ler rótulo com IA<input type="file" id="fotoRotulo" accept="image/*" capture="environment" hidden></label>
        <div id="iaStatus" class="muted" style="margin-top:6px"></div>
      </div>
      <div class="full"><label>Nome do vinho *</label><input name="nome" required placeholder="Ex.: Casillero del Diablo Reserva"></div>
      <div><label>Marca / produtor</label><input name="produtor" placeholder="Ex.: Concha y Toro"></div>
      <div><label>País / região</label><input name="regiao" placeholder="Ex.: Chile, Vale Central"></div>
      <div><label>Tipo *</label><select name="tipo" required></select></div>
      <div><label>Safra</label><input name="safra" type="number" min="1900" max="2100" placeholder="2021"></div>
      <div><label>Qualidade (sua nota)</label><select name="qualidade"><option value="">—</option><option value="1">★ Simples</option><option value="2">★★ Bom</option><option value="3">★★★ Muito bom</option><option value="4">★★★★ Ótimo</option><option value="5">★★★★★ Excepcional</option></select></div>
      <div><label>Quantidade (garrafas)</label><input name="quantidade" type="number" min="0" value="1"></div>
      <div><label>Preço pago (R$)</label><input name="preco" type="number" min="0" step="0.01"></div>
      <div><label>Doçura</label><select name="docura"><option value="">Automática (pela uva)</option><option value="1">Seco / brut</option><option value="2">Meio seco / extra-dry</option><option value="3">Demi-sec</option><option value="4">Suave</option><option value="5">Doce</option></select></div>
      <div class="full"><label>Uva(s) * — marque todas do corte</label><input id="buscaUva" placeholder="Filtrar uvas..." style="margin-bottom:6px"><div class="chips" id="chipsUvas"></div></div>
      <div class="full"><label>Observações</label><textarea name="obs" rows="2" placeholder="Onde comprou, ocasião, impressões..."></textarea></div>
    </div>
    <div class="ft"><button type="button" class="btn sec" id="btnExcluir" hidden>Excluir</button><button class="btn" value="ok" id="btnSalvar">Salvar</button></div>
  </form>
</dialog>

<dialog id="dlgFb">
  <form method="dialog" id="frmFb">
    <div class="hd"><strong>Discordo desta harmonização</strong><button class="btn sec sm" value="cancel" formnovalidate>✕</button></div>
    <div class="bd form">
      <div class="full muted" id="fbResumo"></div>
      <div><label>Seu nome *</label><input name="avaliador" required placeholder="Ex.: João (enólogo)"></div>
      <div><label>Sua nota (0 a 100) *</label><input name="nota" type="number" min="0" max="100" required></div>
      <div class="full"><label>Por quê? O que você serviria?</label><textarea name="comentario" rows="3" placeholder="Ex.: Tanino demais para esse prato, prefiro um Pinot Noir."></textarea></div>
    </div>
    <div class="ft"><button class="btn" value="ok">Enviar</button></div>
  </form>
</dialog>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
