<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Adega</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital@0;1&display=swap" rel="stylesheet">
<meta name="theme-color" content="#f3efe6">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%237a1f2b'/><text x='16' y='23' font-family='Georgia' font-size='20' fill='%23f3efe6' text-anchor='middle'>A</text></svg>">
<style>
:root{
  --papel:#f3efe6;--papel2:#ebe5d8;--tinta:#1f1b18;--suave:#6f665d;--fio:#d6cebf;
  --acc:#7a1f2b;--ok:#3d5a2a;--warn:#9a6a14;--bad:#9b2c2c;
  --tinto:#7a1f2b;--branco:#b8963a;--rose:#c7697e;--espumante:#9c8f5c;--sobremesa:#a8641e;--fortificado:#5a2a1c;
  --serif:'Libre Caslon Text',Georgia,'Times New Roman',serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --papel:#171513;--papel2:#211e1b;--tinta:#ebe5da;--suave:#9d958a;--fio:#35302b;
  --acc:#d0727a;--ok:#9bbd7a;--warn:#d9a84e;--bad:#e07b72;
  --tinto:#c25a63;--branco:#d8bd6a;--rose:#e095a6;--espumante:#c9bc87;--sobremesa:#d49250;--fortificado:#b67a5e;
}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--papel);color:var(--tinta);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
a{color:inherit}

.topo{border-bottom:1px solid var(--tinta)}
.topo .wrap{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:22px;padding-bottom:10px}
.marca{font-family:var(--serif);font-size:30px;letter-spacing:-.01em;line-height:1}
.marca em{font-style:italic;color:var(--acc)}
.meta{font-size:12px;color:var(--suave);font-variant-numeric:tabular-nums;text-align:right}

nav{border-bottom:1px solid var(--fio);position:sticky;top:0;z-index:5;background:var(--papel)}
nav .wrap{display:flex;gap:22px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:12px 0 10px;font:inherit;font-size:14px;color:var(--suave);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--tinta);border-color:var(--tinta)}
main.wrap{padding-top:24px;padding-bottom:48px}
section{display:none}section.on{display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}

.btn{background:var(--tinta);color:var(--papel);border:1px solid var(--tinta);border-radius:3px;padding:9px 14px;font:inherit;font-size:14px;cursor:pointer}
.btn:hover{background:var(--acc);border-color:var(--acc)}
.btn.sec{background:transparent;color:var(--tinta);border-color:var(--fio)}
.btn.sec:hover{border-color:var(--tinta);background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;padding:0;font:inherit;font-size:13px;color:var(--suave);cursor:pointer;text-decoration:underline;text-decoration-color:var(--fio);text-underline-offset:3px}
.link:hover{color:var(--acc);text-decoration-color:currentColor}
.link:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--tinta);background:transparent;border:0;border-bottom:1px solid var(--fio);border-radius:0;padding:8px 2px;width:100%}
select{background:var(--papel)}
input:focus,select:focus,textarea:focus{outline:0;border-bottom-color:var(--tinta)}
textarea{border:1px solid var(--fio);padding:8px}
label{font-size:12px;color:var(--suave);display:block;margin-bottom:2px}
.muted{color:var(--suave);font-size:13px}

/* Carta de vinhos */
.grupo{font-family:var(--serif);font-size:13px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--suave);
  display:flex;justify-content:space-between;border-bottom:1px solid var(--tinta);padding-bottom:6px;margin:30px 0 0}
.grupo:first-child{margin-top:6px}
.vinho{display:grid;grid-template-columns:1fr auto;gap:2px 16px;padding:14px 0 13px;border-bottom:1px solid var(--fio)}
.vinho h3{font-family:var(--serif);font-size:19px;font-weight:400;line-height:1.25}
.vinho .safra{font-family:var(--serif);font-size:19px;font-variant-numeric:tabular-nums;text-align:right}
.vinho .det{font-size:13px;color:var(--suave)}
.vinho .qtd{font-size:12px;color:var(--suave);text-align:right;font-variant-numeric:tabular-nums}
.vinho .extra{grid-column:1/-1;font-size:13px;margin-top:4px}
.vinho .extra i{font-family:var(--serif);color:var(--suave)}
.vinho .acoes{grid-column:1/-1;display:flex;gap:16px;margin-top:6px}
.est{font-size:12px}.est.ponto{color:var(--ok)}.est.jovem{color:var(--warn)}.est.passando{color:var(--bad)}
.nota{color:var(--acc);font-size:12px;letter-spacing:1px}

h2{font-family:var(--serif);font-size:13px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--suave);border-bottom:1px solid var(--tinta);padding-bottom:6px;margin:30px 0 0}
.ficha{padding:16px 0 4px}
.ficha h3{font-family:var(--serif);font-size:26px;font-weight:400;line-height:1.2}
.res{display:grid;grid-template-columns:52px 1fr;gap:0 14px;padding:13px 0;border-bottom:1px solid var(--fio)}
.res strong{font-family:var(--serif);font-size:17px;font-weight:400}
.score{font-family:var(--serif);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.score small{display:block;font-family:var(--sans);font-size:10px;color:var(--suave);margin-top:4px;line-height:1.2}
.why{font-size:13px;color:var(--suave);margin-top:3px}.why li{list-style:none}
.why .p::before{content:'+ ';color:var(--ok)}.why .c::before{content:'− ';color:var(--bad)}
.perfil{display:grid;grid-template-columns:repeat(4,auto);justify-content:start;gap:2px 22px;margin-top:10px;font-size:12px;color:var(--suave)}
.perfil b{display:block;font-weight:400;color:var(--tinta);letter-spacing:2px;font-size:11px}

.uva{padding:14px 0;border-bottom:1px solid var(--fio)}
.uva h3{font-family:var(--serif);font-size:18px;font-weight:400}
.uva .perfil{margin-top:6px}

.chips{display:flex;flex-wrap:wrap;gap:4px 6px;max-height:200px;overflow:auto;padding:4px 0}
.chip{border:1px solid var(--fio);border-radius:3px;padding:3px 8px;font-size:13px;cursor:pointer;user-select:none}
.chip.on{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px 18px}
.form .full{grid-column:1/-1}
dialog{border:1px solid var(--tinta);border-radius:0;padding:0;width:min(620px,calc(100% - 24px));background:var(--papel);color:var(--tinta)}
dialog::backdrop{background:rgba(20,17,15,.55)}
dialog .hd{padding:14px 18px;border-bottom:1px solid var(--fio);display:flex;justify-content:space-between;align-items:center}
dialog .hd strong{font-family:var(--serif);font-size:20px;font-weight:400}
dialog .bd{padding:18px;max-height:72vh;overflow:auto}
dialog .ft{padding:12px 18px;border-top:1px solid var(--fio);display:flex;gap:8px;justify-content:flex-end}
.fechar{background:none;border:0;font-size:22px;line-height:1;color:var(--suave);cursor:pointer;padding:0 2px}
.ia-box{border:1px solid var(--fio);padding:12px;background:var(--papel2)}
.ia-box img{max-height:110px;margin-top:8px;display:block}
.discordo{background:none;border:0;padding:0;margin-top:4px;font:inherit;font-size:12px;color:var(--suave);cursor:pointer;text-decoration:underline;text-decoration-color:var(--fio);text-underline-offset:3px}
.discordo:hover{color:var(--acc)}
.campo-busca{position:relative}
.sugestoes{position:absolute;left:0;right:0;top:100%;z-index:10;background:var(--papel);border:1px solid var(--tinta);border-top:0;max-height:260px;overflow:auto}
.sugestoes button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--fio);padding:8px 10px;font:inherit;color:var(--tinta);cursor:pointer}
.sugestoes button:hover,.sugestoes button.on{background:var(--papel2)}
.sugestoes small{display:block;color:var(--suave);font-size:12px}
.vazio{padding:28px 0;color:var(--suave);font-family:var(--serif);font-size:17px;font-style:italic}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--tinta);color:var(--papel);padding:9px 14px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
footer .wrap{border-top:1px solid var(--fio);padding-top:12px;padding-bottom:28px;font-size:12px;color:var(--suave);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (max-width:520px){.marca{font-size:25px}.perfil{grid-template-columns:repeat(2,auto)}}
</style>
</head>
<body>
<header class="topo"><div class="wrap"><div class="marca">Minha <em>Adega</em></div><div class="meta" id="resumo"></div></div></header>
<nav><div class="wrap">
  <button data-tab="adega" class="on">Carta</button>
  <button data-tab="vinho">O que servir com o vinho</button>
  <button data-tab="comida">Que vinho abrir</button>
  <button data-tab="uvas">Uvas</button>
</div></nav>
<main class="wrap">
  <section id="adega" class="on">
    <div class="row">
      <button class="btn" id="btnNovo">Adicionar vinho</button>
      <input id="busca" placeholder="Buscar na adega" style="flex:1;min-width:160px">
      <select id="filtroTipo" style="width:auto"><option value="">Todos os tipos</option></select>
    </div>
    <div id="listaAdega"></div>
    <div class="row" style="margin-top:22px;gap:18px">
      <button class="link" id="btnExportar">Exportar backup</button>
      <label class="link" style="margin:0">Importar backup<input type="file" id="arqImportar" accept=".json" hidden></label>
      <button class="link" id="btnExemplos">Carregar exemplos</button>
    </div>
  </section>

  <section id="vinho">
    <div class="form" style="margin-bottom:12px">
      <div><label>Vinho da adega</label><select id="selVinho"></select></div>
      <div><label>Ou uma uva</label><select id="selUva"></select></div>
    </div>
    <div id="resVinho"></div>
  </section>

  <section id="comida">
    <div class="form" style="margin-bottom:12px">
      <div class="full"><label>Qual é o prato?</label><select id="selPrato"></select></div>
    </div>
    <div id="resComida"></div>
  </section>

  <section id="uvas"><div id="listaUvas"></div></section>
</main>
<footer><div class="wrap"><span>Os vinhos ficam salvos neste aparelho. Use o backup para levar a outro.</span><span>Beba com moderação.</span></div></footer>

<dialog id="dlg">
  <form method="dialog" id="frm">
    <div class="hd"><strong id="dlgTitulo">Novo vinho</strong><button class="fechar" value="cancel" formnovalidate aria-label="Fechar">×</button></div>
    <div class="bd form">
      <div class="full ia-box">
        <label class="btn" style="margin:0;text-align:center;display:block">Fotografar o rótulo<input type="file" id="fotoRotulo" accept="image/*" capture="environment" hidden></label>
        <div id="iaStatus" class="muted" style="margin-top:6px"></div>
      </div>
      <div class="full campo-busca"><label>Nome do vinho *</label><input name="nome" required autocomplete="off" placeholder="Comece a digitar para buscar no catálogo"><div id="sugestoes" class="sugestoes" hidden></div><div id="catStatus" class="muted" style="margin-top:4px"></div></div>
      <div><label>Marca / produtor</label><input name="produtor" placeholder="Ex.: Concha y Toro"></div>
      <div><label>País / região</label><input name="regiao" placeholder="Ex.: Chile, Vale Central"></div>
      <div><label>Tipo *</label><select name="tipo" required></select></div>
      <div><label>Safra</label><input name="safra" type="number" min="1900" max="2100" placeholder="2021"></div>
      <div><label>Qualidade (sua nota)</label><select name="qualidade"><option value="">—</option><option value="1">1 — simples</option><option value="2">2 — bom</option><option value="3">3 — muito bom</option><option value="4">4 — ótimo</option><option value="5">5 — excepcional</option></select></div>
      <div><label>Quantidade (garrafas)</label><input name="quantidade" type="number" min="0" value="1"></div>
      <div><label>Preço pago (R$)</label><input name="preco" type="number" min="0" step="0.01"></div>
      <div><label>Doçura</label><select name="docura"><option value="">Automática (pela uva)</option><option value="1">Seco / brut</option><option value="2">Meio seco / extra-dry</option><option value="3">Demi-sec</option><option value="4">Suave</option><option value="5">Doce</option></select></div>
      <div class="full"><label>Uvas * (marque todas do corte)</label><input id="buscaUva" placeholder="Filtrar" style="margin-bottom:6px"><div class="chips" id="chipsUvas"></div></div>
      <div class="full"><label>Observações</label><textarea name="obs" rows="2" placeholder="Onde comprou, ocasião, impressões..."></textarea></div>
    </div>
    <div class="ft"><button type="button" class="btn sec" id="btnExcluir" hidden>Excluir</button><button class="btn" value="ok" id="btnSalvar">Salvar</button></div>
  </form>
</dialog>

<dialog id="dlgFb">
  <form method="dialog" id="frmFb">
    <div class="hd"><strong>Discordo desta harmonização</strong><button class="fechar" value="cancel" formnovalidate aria-label="Fechar">×</button></div>
    <div class="bd form">
      <div class="full muted" id="fbResumo"></div>
      <div><label>Seu nome *</label><input name="avaliador" required placeholder="Ex.: João (enólogo)"></div>
      <div><label>Sua nota (0 a 100) *</label><input name="nota" type="number" min="0" max="100" required></div>
      <div class="full"><label>Por quê? O que você serviria?</label><textarea name="comentario" rows="3" placeholder="Ex.: Tanino demais para esse prato, prefiro um Pinot Noir."></textarea></div>
    </div>
    <div class="ft"><button class="btn" value="ok">Enviar</button></div>
  </form>
</dialog>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
