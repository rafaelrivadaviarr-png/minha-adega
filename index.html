<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Adega</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍷</text></svg>">
<style>
:root{--bg:#faf7f5;--card:#fff;--txt:#2a1f22;--muted:#7a6a6e;--line:#eadfe2;--acc:#7b1e3a;--acc2:#a8324f;--ok:#2f7d4f;--warn:#b7791f;--bad:#b42335;
  --tinto:#7b1e3a;--branco:#d9b44a;--rose:#e88ca6;--espumante:#c9b97a;--sobremesa:#c27c2c;--fortificado:#5c2a1a}
@media (prefers-color-scheme:dark){:root{--bg:#161012;--card:#211a1c;--txt:#f1e9eb;--muted:#a8979b;--line:#3a2e31;--acc:#d9587a;--acc2:#e77b97}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.45}
header{background:var(--acc);color:#fff;padding:14px 16px}
header h1{font-size:20px;max-width:960px;margin:0 auto}
header p{font-size:13px;opacity:.85;max-width:960px;margin:2px auto 0}
nav{display:flex;gap:4px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line);padding:0 12px;position:sticky;top:0;z-index:5}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 10px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--acc);border-color:var(--acc)}
main{max-width:960px;margin:0 auto;padding:16px}
section{display:none}section.on{display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.btn.sm{padding:5px 10px;font-size:13px}
input,select,textarea{font:inherit;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
label{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h3{font-size:16px;margin-bottom:2px}
.muted{color:var(--muted);font-size:13px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);margin:2px 4px 2px 0}
.tag.ponto{color:var(--ok);border-color:var(--ok)}.tag.jovem{color:var(--warn);border-color:var(--warn)}.tag.passando{color:var(--bad);border-color:var(--bad)}
.stars{color:#d4a017;letter-spacing:1px}
.res{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:0}
.score{min-width:54px;height:54px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff}
.score small{font-size:9px;font-weight:600;text-transform:uppercase}
.why{font-size:13px;margin-top:4px}.why li{list-style:none}.why .p::before{content:'✓ ';color:var(--ok)}.why .c::before{content:'✗ ';color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-height:220px;overflow:auto;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.chip{border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:13px;cursor:pointer;user-select:none;background:var(--bg)}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.form .full{grid-column:1/-1}
dialog{border:0;border-radius:14px;padding:0;width:min(640px,calc(100% - 32px));background:var(--card);color:var(--txt)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog .hd{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
dialog .bd{padding:16px;max-height:70vh;overflow:auto}
dialog .ft{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:var(--acc)}
.prof{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px;align-items:center;margin-top:8px}
h2{font-size:17px;margin:18px 0 8px}
</style>
</head>
<body>
<header><h1>🍷 Minha Adega</h1><p>Cadastre seus vinhos e descubra o que servir com cada um, ou qual vinho abrir para o prato do dia.</p></header>
<nav>
  <button data-tab="adega" class="on">Adega</button>
  <button data-tab="vinho">Vinho → Comida</button>
  <button data-tab="comida">Comida → Vinho</button>
  <button data-tab="uvas">Guia de uvas</button>
</nav>
<main>
  <section id="adega" class="on">
    <div class="row">
      <button class="btn" id="btnNovo">+ Adicionar vinho</button>
      <input id="busca" placeholder="Buscar por nome, marca, uva..." style="flex:1;min-width:180px">
      <select id="filtroTipo" style="width:auto"><option value="">Todos os tipos</option></select>
    </div>
    <div class="row muted" id="resumo"></div>
    <div class="grid" id="listaAdega"></div>
    <div class="row" style="margin-top:20px">
      <button class="btn sec sm" id="btnExportar">Exportar backup</button>
      <label class="btn sec sm" style="margin:0;color:var(--acc)">Importar backup<input type="file" id="arqImportar" accept=".json" hidden></label>
      <button class="btn sec sm" id="btnExemplos">Carregar exemplos</button>
    </div>
  </section>

  <section id="vinho">
    <div class="form" style="margin-bottom:12px">
      <div><label>Vinho da adega</label><select id="selVinho"></select></div>
      <div><label>…ou uma uva qualquer</label><select id="selUva"></select></div>
    </div>
    <div id="resVinho"></div>
  </section>

  <section id="comida">
    <div class="form" style="margin-bottom:12px">
      <div class="full"><label>Qual é o prato?</label><select id="selPrato"></select></div>
    </div>
    <div id="resComida"></div>
  </section>

  <section id="uvas"><div class="grid" id="listaUvas"></div></section>
</main>

<dialog id="dlg">
  <form method="dialog" id="frm">
    <div class="hd"><strong id="dlgTitulo">Novo vinho</strong><button class="btn sec sm" value="cancel" formnovalidate>✕</button></div>
    <div class="bd form">
      <div class="full"><label>Nome do vinho *</label><input name="nome" required placeholder="Ex.: Casillero del Diablo Reserva"></div>
      <div><label>Marca / produtor</label><input name="produtor" placeholder="Ex.: Concha y Toro"></div>
      <div><label>País / região</label><input name="regiao" placeholder="Ex.: Chile, Vale Central"></div>
      <div><label>Tipo *</label><select name="tipo" required></select></div>
      <div><label>Safra</label><input name="safra" type="number" min="1900" max="2100" placeholder="2021"></div>
      <div><label>Qualidade (sua nota)</label><select name="qualidade"><option value="">—</option><option value="1">★ Simples</option><option value="2">★★ Bom</option><option value="3">★★★ Muito bom</option><option value="4">★★★★ Ótimo</option><option value="5">★★★★★ Excepcional</option></select></div>
      <div><label>Quantidade (garrafas)</label><input name="quantidade" type="number" min="0" value="1"></div>
      <div><label>Preço pago (R$)</label><input name="preco" type="number" min="0" step="0.01"></div>
      <div><label>Doçura</label><select name="docura"><option value="">Automática (pela uva)</option><option value="1">Seco / brut</option><option value="2">Meio seco / extra-dry</option><option value="3">Demi-sec</option><option value="4">Suave</option><option value="5">Doce</option></select></div>
      <div class="full"><label>Uva(s) * — marque todas do corte</label><input id="buscaUva" placeholder="Filtrar uvas..." style="margin-bottom:6px"><div class="chips" id="chipsUvas"></div></div>
      <div class="full"><label>Observações</label><textarea name="obs" rows="2" placeholder="Onde comprou, ocasião, impressões..."></textarea></div>
    </div>
    <div class="ft"><button type="button" class="btn sec" id="btnExcluir" hidden>Excluir</button><button class="btn" value="ok" id="btnSalvar">Salvar</button></div>
  </form>
</dialog>

<script src="data.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
